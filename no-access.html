<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Admin access only · Funding Tier</title>
<style>
  :root{--ground:#f4f6f8;--surface:#fff;--line:#d6dce4;--text:#141a22;
        --mid:#4a5666;--dim:#6d7a8b;--accent:#0c6f6b}
  @media (prefers-color-scheme: dark){
    :root{--ground:#10151b;--surface:#171d25;--line:#2c3542;--text:#e4e9ef;
          --mid:#a8b3c1;--dim:#7e8b9b;--accent:#46bdb5}
  }
  *{box-sizing:border-box}
  body{margin:0;min-height:100vh;display:grid;place-items:center;padding:1.5rem;
       background:var(--ground);color:var(--text);
       font-family:system-ui,-apple-system,"Segoe UI",sans-serif;font-size:16px}
  .card{width:100%;max-width:26rem;background:var(--surface);border:1px solid var(--line);
        border-radius:12px;padding:2rem;text-align:center;
        box-shadow:0 1px 2px rgba(0,0,0,.05),0 6px 20px rgba(0,0,0,.05)}
  h1{font-size:1.3rem;margin:0 0 .5rem;letter-spacing:-.01em}
  p{color:var(--mid);line-height:1.6;margin:0 0 1.4rem}
  a{display:inline-block;background:var(--accent);color:#fff;text-decoration:none;
    padding:.7rem 1.4rem;border-radius:7px;font-weight:600}
  .foot{margin-top:1.4rem;font-size:.8rem;color:var(--dim);margin-bottom:0}
</style>
</head>
<body>
  <main class="card">
    <h1>Admin access only</h1>
    <p>You're signed in, but this tool is limited to admins. If you think that's
       wrong, ask an admin to check your access level.</p>
    <a href="/">Back to the tools</a>
    <p class="foot">Access is recorded against your Funding Tier account.</p>
  </main>
</body>
</html>
